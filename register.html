<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087db3"><title>สร้างบัญชี Admin | FreshMart</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body><main class="auth-shell"><div class="card auth-card"><div class="card-body p-4 p-md-5">
  <div class="text-center mb-4"><div class="brand__mark mx-auto mb-3">FM</div><h1 class="h3 mb-1">สร้างบัญชีผู้ดูแล</h1><p class="text-secondary">บัญชีใหม่ต้องได้รับ Role จากฐานข้อมูล</p></div>
  <form data-auth="register"><div class="mb-3"><label class="form-label">ชื่อ–นามสกุล</label><input class="form-control" name="full_name" required></div><div class="mb-3"><label class="form-label">เบอร์โทรศัพท์</label><input class="form-control" name="phone" type="tel" required></div><div class="mb-3"><label class="form-label">อีเมล</label><input class="form-control" name="email" type="email" autocomplete="email" required></div><div class="mb-4"><label class="form-label">รหัสผ่าน</label><input class="form-control" name="password" type="password" autocomplete="new-password" minlength="8" required><div class="form-text">อย่างน้อย 8 ตัวอักษรและไม่ควรซ้ำกับบริการอื่น</div></div><button class="btn btn-primary btn-lg w-100" type="submit">สร้างบัญชี</button></form>
  <p class="text-center mt-4 mb-0"><a class="back-link justify-content-center" href="login.html">← กลับไปเข้าสู่ระบบ</a></p>
</div></div></main><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script type="module" src="js/auth.js"></script></body>
</html>

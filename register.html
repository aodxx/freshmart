<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมัครสมาชิก | FreshMart</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><main class="auth-shell"><div class="card auth-card"><div class="card-body p-4 p-md-5"><h1 class="h3 text-center mb-4">สมัครสมาชิก FreshMart</h1><form data-auth="register"><input class="form-control mb-3" name="full_name" placeholder="ชื่อ-นามสกุล" required><input class="form-control mb-3" name="phone" type="tel" placeholder="เบอร์โทรศัพท์" required><input class="form-control mb-3" name="email" type="email" placeholder="อีเมล" required><input class="form-control mb-4" name="password" type="password" minlength="8" placeholder="รหัสผ่านอย่างน้อย 8 ตัว" required><button class="btn btn-primary btn-lg w-100" type="submit">สมัครสมาชิก</button></form><p class="text-center mt-4"><a href="login.html">กลับไปเข้าสู่ระบบ</a></p></div></div></main><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script type="module" src="js/auth.js"></script></body></html>

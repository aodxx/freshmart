<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087db3"><title>Admin Login | FreshMart</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body><main class="auth-shell"><div class="card auth-card"><div class="card-body p-4 p-md-5">
  <div class="text-center mb-4"><div class="brand__mark mx-auto mb-3">FM</div><span class="eyebrow text-primary border bg-light">สำหรับผู้ดูแลร้าน</span><h1 class="h3 mt-3 mb-1">ยินดีต้อนรับกลับ</h1><p class="text-secondary">เข้าสู่ศูนย์จัดการร้านชำเจ๊ดี</p></div>
  <form data-auth="login"><div class="mb-3"><label class="form-label">อีเมล</label><input class="form-control form-control-lg" name="email" type="email" autocomplete="email" required></div><div class="mb-4"><label class="form-label">รหัสผ่าน</label><input class="form-control form-control-lg" name="password" type="password" autocomplete="current-password" minlength="8" required></div><button class="btn btn-primary btn-lg w-100" type="submit">เข้าสู่ระบบ Admin</button></form>
  <p class="text-center text-secondary small mt-4 mb-0">หน้าร้านสำหรับลูกค้าเปิดผ่าน LINE LIFF</p>
</div></div></main><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script type="module" src="js/auth.js"></script></body>
</html>

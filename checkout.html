<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ชำระเงิน | FreshMart</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><main class="container py-4" style="max-width:800px"><a href="cart.html">← กลับตะกร้า</a><h1 class="my-4">ยืนยันคำสั่งซื้อ</h1><form class="card border-0 shadow-sm" data-checkout><div class="card-body p-4"><h2 class="h5">ข้อมูลจัดส่ง</h2><input class="form-control mb-3" name="recipient_name" placeholder="ชื่อผู้รับ" required><input class="form-control mb-3" name="recipient_phone" type="tel" placeholder="เบอร์โทร" required><textarea class="form-control mb-3" name="shipping_address" placeholder="ที่อยู่จัดส่ง" required></textarea><textarea class="form-control mb-3" name="customer_note" placeholder="หมายเหตุ (ถ้ามี)"></textarea><input class="form-control mb-4" name="coupon_code" placeholder="รหัสคูปอง เช่น WELCOME10"><h2 class="h5">วิธีชำระเงิน</h2><select class="form-select mb-3" name="payment_method" required><option value="bank_transfer">โอนบัญชีธนาคาร</option><option value="promptpay">PromptPay</option><option value="cash">เงินสด</option></select><label class="form-label">แนบสลิป (สำหรับโอน/PromptPay)</label><input class="form-control mb-4" type="file" name="slip" accept="image/jpeg,image/png,image/webp"><div class="d-flex justify-content-between fs-5 mb-3"><strong>ยอดก่อนส่วนลด</strong><strong data-cart-total></strong></div><button class="btn btn-primary btn-lg w-100" type="submit">ยืนยันสั่งซื้อ</button></div></form></main><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script type="module" src="js/checkout.js"></script></body></html>
